name: image
on:
  push:
    branches: [main, commercial]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/exportfinance/remoteview-site:${{ github.ref_name == 'commercial' && 'commercial' || 'latest' }}
          build-args: |
            RV_EDITION=${{ github.ref_name == 'commercial' && 'commercial' || 'private' }}
          labels: org.opencontainers.image.source=https://github.com/exportfinance/remoteview-site
